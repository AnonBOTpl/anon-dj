[package]
name = "dj"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "ANON DJ — aplikacja DJ-a (kolejka dedykacji, biblioteka, TTS, odtwarzacz)"

[lib]
# Sufiks `_lib` jest konieczny, żeby nazwa biblioteki nie kolidowała z nazwą binarki
# (problem dotyczy tylko Windows): https://github.com/rust-lang/cargo/issues/8519
name = "dj_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Rotowane dzienne logi do pliku (standardowe dopełnienie `tracing`).
tracing-appender = "0.2.5"
# SQLite wkompilowane w binarkę (`bundled`) — żadnych zewnętrznych DLL-i, pełny offline.
rusqlite = { version = "0.40.2", features = ["bundled"] }
