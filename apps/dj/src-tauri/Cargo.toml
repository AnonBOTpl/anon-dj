[package]
name = "dj"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "ANON DJ — aplikacja DJ-a (kolejka dedykacji, biblioteka, TTS, odtwarzacz)"

[lib]
# Sufiks `_lib` jest konieczny, żeby nazwa biblioteki nie kolidowała z nazwą binarki
# (problem dotyczy tylko Windows): https://github.com/rust-lang/cargo/issues/8519
name = "dj_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Rotowane dzienne logi do pliku (standardowe dopełnienie `tracing`).
tracing-appender = "0.2.5"
# SQLite wkompilowane w binarkę (`bundled`) — żadnych zewnętrznych DLL-i, pełny offline.
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Rekurencyjne przechodzenie po folderach biblioteki (własna implementacja byłaby dłuższa i gorsza
# w obsłudze dowiązań oraz błędów dostępu).
walkdir = "2.5.0"
# Odczyt metadanych z plików audio: ID3, Vorbis Comments, MP4/ilst itd. Bez własnego parsera ID3.
lofty = "0.25.4"
# Natywne okno wyboru folderu. Alternatywą byłoby ręczne wpisywanie ścieżki, ale DJ przy imprezie
# nie powinien walczyć z literówkami w „C:\Muzyka\Wesela 2026”.
tauri-plugin-dialog = "2"
# Sieć: serwer WebSocket dla kiosków. `tokio` i tak ciągnie Tauri, ale dopisujemy je wprost,
# bo używamy własnych typów sieciowych, kanałów i limitów czasu.
tokio = { version = "1.53.1", features = ["net", "sync", "time", "rt", "macros"] }
# Obsługa samego protokołu WebSocket (handshake, ramki, ping/pong) — pisanie tego ręcznie
# byłoby proszeniem się o błędy w najbardziej newralgicznym miejscu imprezy.
tokio-tungstenite = "0.30.0"
# Metody `next()`/`send()` na strumieniu WebSocket to cechy z `futures` — `tokio-tungstenite`
# sam ich nie wystawia. Crate jest już w drzewie zależności (ciągnie go Tauri).
futures-util = "0.3.34"
# Synteza mowy (Piper) w Rustcie. `piper-rs` odpada: buduje espeak-ng przez bindgen i CMake
# (potrzebne libclang i cmake), a jego ONNX Runtime wymaga AVX2 i wywraca się na FX-8300.
# `sherpa-onnx` linkuje gotowe biblioteki statyczne pobierane raz w buildzie (skrypt budujący
# używa do tego `ureq`/`tar`/`bzip2`/`zip`) — bez dodatkowych narzędzi i bez AVX2. (PLAN.md, sekcja 8)
sherpa-onnx = "1.13.8"
# Odtwarzanie klipu lektora na wybranym urządzeniu wyjściowym (PLAN.md, sekcja 8). `rodio` daje
# gotowe otwieranie strumienia (na Windows przez WASAPI) i dekodowanie WAV; własna implementacja
# oznaczałaby pisanie dekodera i obsługę formatów próbek, czyli miejsce na błędy w najbardziej
# słyszalnym punkcie aplikacji. Wyłączamy domyślne dekodery (mp3/mp4/vorbis/flac), bo gramy
# wyłącznie własne WAV-y, a `tracing` kieruje błędy strumienia do naszego logu.
rodio = { version = "0.22.2", default-features = false, features = ["playback", "wav", "tracing"] }
# Klient HTTP do lokalnego API odtwarzacza (beefweb). `ureq` jest synchroniczny i lekki
# (bez async runtime i bez TLS), a wywołania i tak idą przez `spawn_blocking`, żeby nie
# blokować wątku UI (AGENTS.md). TLS jest wyłączony świadomie: beefweb stoi na localhost.
ureq = { version = "3.4.2", default-features = false, features = ["json"] }
