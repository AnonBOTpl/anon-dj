[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "apps/dj/src-tauri",
    "apps/kiosk/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["ANON DJ"]

[workspace.dependencies]
protocol = { path = "crates/protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tracing = "0.1.44"

# Konfiguracja zwolnienia wspólna dla obu aplikacji (w pakietach nie może być własnych profili).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
